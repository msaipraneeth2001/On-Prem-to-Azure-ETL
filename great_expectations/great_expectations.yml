# great_expectations.yml
config_version: 3.0

# Datasources configuration
datasources:
  spark_silver_datasource: # Existing silver datasource
    class_name: Datasource
    execution_engine:
      class_name: SparkDFExecutionEngine
    data_connectors:
      delta_silver_connector:
        class_name: InferredAssetFilesystemDataConnector # Kept as per previous state
        base_directory: /mnt/silver/SalesLT/
        glob_directive: "*/" # Each subdirectory is a data asset (Delta table)
        default_regex:
          pattern: (.*)/ # Capture the directory name as the asset name
          group_names:
            - data_asset_name
        assets:
          Product: {} # Explicitly define the Product data asset, connector will infer details

  spark_gold_datasource: # New gold datasource
    class_name: Datasource
    execution_engine:
      class_name: SparkDFExecutionEngine
    data_connectors:
      delta_gold_connector:
        class_name: InferredAssetDBFSDataConnector # As specified for gold
        base_directory: /mnt/gold/SalesLT/
        glob_directive: "*/" # Each subdirectory is a data asset
        default_regex:
          pattern: (.*)/ # Capture the directory name as the asset name
          group_names:
            - data_asset_name
        assets:
          Product: {} # Define the Product data asset for gold

# Stores for Expectations, Validations, and Data Docs
stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: expectations/
  # validations_store:
  #   class_name: ValidationsStore
  #   store_backend:
  #     class_name: TupleFilesystemStoreBackend
  #     base_directory: uncommitted/validations/
  # evaluation_parameter_store:
  #   class_name: EvaluationParameterStore

# Directory for custom plugins
plugins_directory: plugins/

# Configuration for Data Docs
data_docs_sites:
  local_site:
    class_name: SiteBuilder
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: uncommitted/data_docs/local_site/
    site_index_builder:
      class_name: DefaultSiteIndexBuilder

# Path to the file storing configuration variables
config_variables_file_path: uncommitted/config_variables.yml

